name: format-review

on:
  push:
    branches:
      - "consultoria/fnde-correctness-performance"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "consultoria/fnde-correctness-performance"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Format reviewed non-legacy files
        run: bunx prettier --write src/lib/fnde.ts src/lib/ibge.ts tests/fnde.test.ts tests/ibge.test.ts package.json
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git config user.name "shivinhazen"
          git config user.email "140849413+shivinhazen@users.noreply.github.com"
          git add src/lib/fnde.ts src/lib/ibge.ts tests/fnde.test.ts tests/ibge.test.ts package.json
          git commit -m "style: format reviewed source and tests [skip ci]"
          git push
