name: quality

on:
  pull_request:
  push:
    branches:
      - "consultoria/**"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Tests
        run: bun run test

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build
